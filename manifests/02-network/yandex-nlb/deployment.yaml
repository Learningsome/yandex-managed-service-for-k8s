apiVersion: v1
kind: Namespace
metadata:
  name: application

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hello
  namespace: application
spec:
  replicas: 2
  selector:
    matchLabels:
      app: hello
  template:
    metadata:
      labels:
        app: hello
    spec:
      containers:
        - name: hello-app
          image: cr.yandex/crpjd37scfv653nl11i9/hello:1.1
          resources:
            requests:
              memory: "64Mi"
              cpu: "100m"
            limits:
              memory: "128Mi"
              cpu: "200m"

---
apiVersion: v1
kind: Service
metadata:
  name: hello
  namespace: application
spec:
  type: LoadBalancer
  ports:
    - port: 80
      name: handler # Имя обработчика внутри сервиса Network Load Balancer
      targetPort: 8080
  # Kubernetes-метки селектора, использованные в шаблоне Pods при создании объекта Deployment
  selector:
    app: hello
